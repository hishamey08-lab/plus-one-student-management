<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plus One Student Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
            min-height: 100vh;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
            opacity: 0.8;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 40px;
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #555;
        }

        .login-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .login-container button {
            width: 250px;
            padding: 18px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-container button:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>PLUS ONE</h1>
        <p>Student Management System</p>
    </header>

    <main class="container">

        <div class="welcome">
            <h2>Welcome 👋</h2>

            <p>
                Access student results, study materials,
                notes and class announcements.
            </p>
        </div>

        <div class="login-container">

            <button onclick="studentLogin()">
                👨‍🎓 Student Login
            </button>

            <button onclick="teacherLogin()">
                👨‍🏫 Teacher Login
            </button>

        </div>

    </main>

    <footer>
        <p>Plus One Student Management System</p>
    </footer>


    <script>

        function studentLogin() {
            alert("Student Login will be added in the next step.");
        }

        function teacherLogin() {
            alert("Teacher Login will be added in the next step.");
        }

    </script>

</body>
</html>
